<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 620" width="280" height="620">
  <defs>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8E182D"/>
      <stop offset="25%" stopColor="#C41E3A"/>
      <stop offset="50%" stopColor="#FF6B81"/>
      <stop offset="75%" stopColor="#C41E3A"/>
      <stop offset="100%" stopColor="#8E182D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F3E5AB"/>
      <stop offset="50%" stopColor="#D4AF37"/>
      <stop offset="100%" stopColor="#AA771C"/>
    </linearGradient>
  </defs>
  <!-- Can Body -->
  <rect x="45" y="65" width="190" height="490" rx="20" fill="url(#canBody)" stroke="#E5CCA5" stroke-width="1.5"/>
  <!-- Top Rim -->
  <ellipse cx="140" cy="55" rx="85" ry="15" fill="#ECECF0" stroke="#8A8A8E" stroke-width="2"/>
  <ellipse cx="140" cy="55" rx="75" ry="12" fill="#BEBEC4"/>
  <!-- Text -->
  <text x="140" y="130" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#E5CCA5">PREMIUM COLLAGEN BEVERAGE</text>
  <text x="140" y="190" text-anchor="middle" font-family="'Playfair Display', serif" font-size="28" font-weight="700" letter-spacing="5" fill="url(#gold)">COLLAVIAH</text>
  <text x="140" y="215" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="16" fill="#FFFFFF">Glow from Within</text>
  <text x="140" y="340" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#FFFFFF">STRAWBERRY LIME</text>
